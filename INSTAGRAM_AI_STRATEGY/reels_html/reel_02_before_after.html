<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    background: #06060f;
    font-family: Arial, sans-serif;
    overflow: hidden; color: white;
  }

  .bg {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 20% 30%, rgba(255,60,0,0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(0,180,100,0.12) 0%, transparent 60%),
                linear-gradient(180deg, #06060f 0%, #0a0520 100%);
  }

  /* TOP: POV TITLE */
  .pov-title {
    position: absolute;
    top: 6%;
    width: 100%;
    text-align: center;
    opacity: 0;
    animation: zoomIn 0.5s cubic-bezier(.175,.885,.32,1.275) 0.1s forwards;
  }
  @keyframes zoomIn {
    from { transform: scale(0.3); opacity: 0; filter: blur(15px); }
    to   { transform: scale(1); opacity: 1; filter: blur(0); }
  }
  .pov-badge {
    display: inline-block;
    background: linear-gradient(135deg, #ff4444, #cc0000);
    font-size: 42px; font-weight: 900;
    padding: 12px 48px; border-radius: 100px;
    letter-spacing: 4px;
    box-shadow: 0 8px 40px rgba(255,0,0,0.4);
  }
  .pov-subtitle {
    font-size: 62px; font-weight: 900;
    margin-top: 20px;
    background: linear-gradient(135deg, #fff, #ccc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    line-height: 1.2;
  }

  /* SPLIT SCREEN */
  .split {
    position: absolute;
    top: 22%;
    left: 40px; right: 40px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    opacity: 0;
    animation: fadeUp 0.7s ease 0.9s forwards;
  }
  @keyframes fadeUp {
    from { transform: translateY(60px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }

  .panel {
    border-radius: 20px;
    padding: 28px 22px;
    position: relative;
    overflow: hidden;
  }
  .panel-before {
    background: linear-gradient(135deg, #1a0505, #2d0a0a);
    border: 2px solid rgba(255,50,50,0.4);
  }
  .panel-after {
    background: linear-gradient(135deg, #041a09, #082d12);
    border: 2px solid rgba(0,200,80,0.4);
  }
  .panel-label {
    font-size: 28px; font-weight: 900;
    margin-bottom: 18px;
    display: flex; align-items: center; gap: 10px;
  }
  .label-before { color: #ff4444; }
  .label-after  { color: #00cc55; }

  .panel-item {
    font-size: 23px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; gap: 10px;
    line-height: 1.3;
    color: rgba(255,255,255,0.8);
    opacity: 0;
  }
  .panel-before .panel-item { animation: itemIn 0.4s ease forwards; }
  .panel-after  .panel-item { animation: itemIn 0.4s ease forwards; }

  @keyframes itemIn {
    from { transform: translateX(30px); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }

  .panel-before .panel-item:nth-child(2) { animation-delay: 1.3s; }
  .panel-before .panel-item:nth-child(3) { animation-delay: 1.7s; }
  .panel-before .panel-item:nth-child(4) { animation-delay: 2.1s; }
  .panel-before .panel-item:nth-child(5) { animation-delay: 2.5s; }

  .panel-after .panel-item:nth-child(2) { animation-delay: 1.5s; }
  .panel-after .panel-item:nth-child(3) { animation-delay: 1.9s; }
  .panel-after .panel-item:nth-child(4) { animation-delay: 2.3s; }
  .panel-after .panel-item:nth-child(5) { animation-delay: 2.7s; }

  .x { color: #ff4444; font-size: 28px; flex-shrink: 0; }
  .v { color: #00cc55; font-size: 28px; flex-shrink: 0; }

  /* RESULT BOX */
  .result-box {
    position: absolute;
    top: 72%;
    left: 40px; right: 40px;
    background: linear-gradient(135deg, #0d0525, #1a0a2e);
    border: 2px solid rgba(180, 100, 255, 0.5);
    border-radius: 24px;
    padding: 32px;
    text-align: center;
    opacity: 0;
    animation: popIn 0.6s cubic-bezier(.175,.885,.32,1.275) 3.5s forwards;
    box-shadow: 0 0 60px rgba(150,50,255,0.2);
  }
  @keyframes popIn {
    from { transform: scale(0.8); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .result-number {
    font-size: 96px; font-weight: 900;
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    line-height: 1;
  }
  .result-label {
    font-size: 32px; color: rgba(255,255,255,0.7);
    margin-top: 8px;
  }

  /* COUNTER ANIMATION */
  .counter {
    animation: countUp 1s ease 3.5s;
  }
  @keyframes countUp {
    from { content: '0'; }
  }

  /* CTA */
  .cta {
    position: absolute;
    bottom: 5%;
    width: 100%;
    text-align: center;
    opacity: 0;
    animation: slideUp 0.5s ease 5s forwards;
  }
  @keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  .cta-inner {
    display: inline-block;
    background: linear-gradient(135deg, #6600ff, #aa00ff);
    font-size: 40px; font-weight: 900;
    padding: 22px 56px; border-radius: 100px;
    box-shadow: 0 12px 40px rgba(100,0,255,0.4);
  }

  .watermark {
    position: absolute; bottom: 1.5%;
    width: 100%; text-align: center;
    color: rgba(255,255,255,0.25); font-size: 24px;
  }

  /* VS DIVIDER */
  .vs {
    position: absolute;
    top: 22%;
    left: 50%;
    transform: translateX(-50%);
    width: 60px; height: 60px;
    background: linear-gradient(135deg, #ff4444, #6600ff);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 900;
    z-index: 10;
    opacity: 0;
    animation: fadeIn 0.3s ease 0.9s forwards;
    box-shadow: 0 4px 20px rgba(100,0,200,0.5);
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="bg"></div>

  <div class="pov-title">
    <div class="pov-badge">לפני VS אחרי</div>
    <div class="pov-subtitle">AI שינה הכל<br>לבעלי עסקים</div>
  </div>

  <div class="vs">VS</div>

  <div class="split">
    <!-- BEFORE -->
    <div class="panel panel-before">
      <div class="panel-label label-before">❌ לפני</div>
      <div class="panel-item"><span class="x">×</span>שעה לכל הצעת מחיר</div>
      <div class="panel-item"><span class="x">×</span>תשובה ידנית לכל לקוח</div>
      <div class="panel-item"><span class="x">×</span>שוכחים פולו-אפ</div>
      <div class="panel-item"><span class="x">×</span>12 שעות עבודה</div>
    </div>

    <!-- AFTER -->
    <div class="panel panel-after">
      <div class="panel-label label-after">✅ אחרי</div>
      <div class="panel-item"><span class="v">✓</span>30 שניות בChatGPT</div>
      <div class="panel-item"><span class="v">✓</span>תשובה אוטומטית 24/7</div>
      <div class="panel-item"><span class="v">✓</span>פולו-אפ אוטומטי</div>
      <div class="panel-item"><span class="v">✓</span>8 שעות + יותר כסף</div>
    </div>
  </div>

  <!-- RESULT -->
  <div class="result-box">
    <div class="result-number" id="counter">+30%</div>
    <div class="result-label">הכנסה גבוהה יותר — אותו מאמץ</div>
  </div>

  <div class="cta">
    <div class="cta-inner">שמרו 📌 + עקבו</div>
  </div>

  <div class="watermark">@okun_igal</div>
</body>
</html>
