<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1920px;
    background:#020208;
    font-family:Arial,sans-serif;
    overflow:hidden; color:white;
  }

  /* ANIMATED MESH GRADIENT */
  .bg {
    position:absolute; inset:0;
    background:#020208;
    overflow:hidden;
  }
  .orb {
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    animation:orbFloat linear infinite;
  }
  @keyframes orbFloat {
    0%   { transform:translate(0,0) scale(1); }
    25%  { transform:translate(80px,-60px) scale(1.1); }
    50%  { transform:translate(-40px,100px) scale(0.9); }
    75%  { transform:translate(-80px,-40px) scale(1.05); }
    100% { transform:translate(0,0) scale(1); }
  }

  /* HOOK */
  .hook {
    position:absolute; top:4%; width:100%; text-align:center;
    opacity:0;
    animation:hookSlam 0.3s ease 0.1s forwards;
  }
  @keyframes hookSlam {
    from { transform:scale(1.5); opacity:0; filter:blur(10px); }
    to   { transform:scale(1); opacity:1; filter:blur(0); }
  }
  .hook h1 {
    font-size:76px; font-weight:900; line-height:1.1;
    background:linear-gradient(135deg,#f0f0f0,#888);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .hook-accent {
    font-size:92px; font-weight:900; display:block; margin:8px 0;
    background:linear-gradient(135deg,#ffd700,#ff8c00,#ff4500);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 30px rgba(255,150,0,0.5));
  }

  /* COUNTER SECTION */
  .counters {
    position:absolute;
    top:28%;
    left:30px; right:30px;
    opacity:0;
    animation:fadeUp 0.6s ease 0.7s forwards;
  }
  @keyframes fadeUp {
    from{transform:translateY(50px);opacity:0} to{opacity:1;transform:none}
  }

  .counter-row {
    display:grid; grid-template-columns:1fr 1fr;
    gap:16px; margin-bottom:16px;
  }

  .counter-card {
    background:rgba(255,255,255,0.03);
    border-radius:20px;
    padding:28px 20px;
    text-align:center;
    border:1px solid rgba(255,255,255,0.06);
    position:relative;
    overflow:hidden;
    opacity:0;
  }
  .cc-1 { animation:cardReveal .4s ease 1.1s forwards; border-color:rgba(255,100,0,.3); }
  .cc-2 { animation:cardReveal .4s ease 1.4s forwards; border-color:rgba(100,200,255,.3); }
  .cc-3 { animation:cardReveal .4s ease 1.7s forwards; border-color:rgba(200,100,255,.3); }
  .cc-4 { animation:cardReveal .4s ease 2.0s forwards; border-color:rgba(0,220,100,.3); }

  @keyframes cardReveal {
    from{transform:scale(0.7) rotate(10deg);opacity:0}
    to{transform:none;opacity:1}
  }

  .counter-card::before {
    content:'';
    position:absolute; inset:0;
    background:inherit;
    border-radius:20px;
  }

  .cc-bg-1 { background:radial-gradient(circle at 50% 50%, rgba(255,100,0,.15), transparent 70%); }
  .cc-bg-2 { background:radial-gradient(circle at 50% 50%, rgba(100,200,255,.12), transparent 70%); }
  .cc-bg-3 { background:radial-gradient(circle at 50% 50%, rgba(200,100,255,.12), transparent 70%); }
  .cc-bg-4 { background:radial-gradient(circle at 50% 50%, rgba(0,220,100,.12), transparent 70%); }

  .count-num {
    font-size:68px; font-weight:900;
    line-height:1;
  }
  .num-1 { color:#ff6b00; }
  .num-2 { color:#44aaff; }
  .num-3 { color:#cc55ff; }
  .num-4 { color:#00cc55; }

  .count-unit { font-size:36px; font-weight:700; opacity:.7; }
  .count-desc { font-size:21px; color:rgba(255,255,255,.6); margin-top:8px; line-height:1.3; }

  /* ANIMATED PROGRESS BAR */
  .progress-section {
    position:absolute;
    top:62%;
    left:30px; right:30px;
    opacity:0;
    animation:fadeUp 0.5s ease 2.8s forwards;
  }

  .progress-title {
    font-size:34px; font-weight:700; margin-bottom:16px;
    text-align:center; color:rgba(255,255,255,.8);
  }

  .prog-row { margin-bottom:18px; }
  .prog-label {
    display:flex; justify-content:space-between;
    font-size:24px; margin-bottom:8px;
    color:rgba(255,255,255,.8);
  }
  .prog-bar {
    height:20px;
    background:rgba(255,255,255,.08);
    border-radius:100px;
    overflow:hidden;
  }
  .prog-fill {
    height:100%;
    border-radius:100px;
    width:0;
    animation:fillBar 1.2s ease forwards;
  }
  .pf-1 { background:linear-gradient(90deg,#ff6b00,#ffd700); animation-delay:3s; }
  .pf-2 { background:linear-gradient(90deg,#44aaff,#00ccff); animation-delay:3.3s; }
  .pf-3 { background:linear-gradient(90deg,#cc55ff,#ff44aa); animation-delay:3.6s; }
  @keyframes fillBar {
    to { width:var(--w); }
  }

  /* CTA */
  .cta {
    position:absolute; bottom:4%; width:100%; text-align:center;
    opacity:0;
    animation:ctaIn 0.5s ease 5s forwards;
  }
  @keyframes ctaIn {
    from{transform:translateY(40px);opacity:0} to{opacity:1;transform:none}
  }
  .cta-inner {
    display:inline-block;
    background:linear-gradient(135deg,#ffd700,#ff8c00);
    color:#000; font-size:40px; font-weight:900;
    padding:22px 56px; border-radius:100px;
    box-shadow:0 12px 40px rgba(255,180,0,.4);
  }
  .watermark {
    position:absolute; bottom:1%;
    width:100%; text-align:center;
    color:rgba(255,255,255,.2); font-size:22px;
  }
</style>
</head>
<body>
  <div class="bg">
    <div class="orb" style="width:400px;height:400px;background:rgba(255,100,0,.15);left:-100px;top:200px;animation-duration:12s;"></div>
    <div class="orb" style="width:500px;height:500px;background:rgba(100,0,255,.1);right:-150px;top:600px;animation-duration:15s;animation-delay:-5s;"></div>
    <div class="orb" style="width:350px;height:350px;background:rgba(0,200,100,.08);left:100px;top:1400px;animation-duration:10s;animation-delay:-3s;"></div>
  </div>

  <div class="hook">
    <h1>כמה אנשים</h1>
    <span class="hook-accent">מחפשים את<br>מה שאתה מוכר?</span>
  </div>

  <div class="counters">
    <div class="counter-row">
      <div class="counter-card cc-bg-1 cc-1">
        <div class="count-num num-1">126<span class="count-unit">K</span></div>
        <div class="count-desc">מחפשי עבודה<br>בקבוצה אחת</div>
      </div>
      <div class="counter-card cc-bg-2 cc-2">
        <div class="count-num num-2">89<span class="count-unit">K</span></div>
        <div class="count-desc">דרושים<br>חיפוש עבודה</div>
      </div>
    </div>
    <div class="counter-row">
      <div class="counter-card cc-bg-3 cc-3">
        <div class="count-num num-3">380<span class="count-unit">K</span></div>
        <div class="count-desc">בעלי עסקים<br>קבוצות פרסום</div>
      </div>
      <div class="counter-card cc-bg-4 cc-4">
        <div class="count-num num-4">53<span class="count-unit">K</span></div>
        <div class="count-desc">מחפשי עבודה<br>בישראל</div>
      </div>
    </div>
  </div>

  <div class="progress-section">
    <div class="progress-title">🎯 הנישה הכי שווה — בעלי מקצוע</div>
    <div class="prog-row">
      <div class="prog-label"><span>חשמלאים</span><span>92%</span></div>
      <div class="prog-bar"><div class="prog-fill pf-1" style="--w:92%"></div></div>
    </div>
    <div class="prog-row">
      <div class="prog-label"><span>אינסטלטורים</span><span>88%</span></div>
      <div class="prog-bar"><div class="prog-fill pf-2" style="--w:88%"></div></div>
    </div>
    <div class="prog-row">
      <div class="prog-label"><span>שיפוצניקים</span><span>85%</span></div>
      <div class="prog-bar"><div class="prog-fill pf-3" style="--w:85%"></div></div>
    </div>
  </div>

  <div class="cta">
    <div class="cta-inner">עקבו — טיפים יומיים ⬇️</div>
  </div>
  <div class="watermark">@okun_igal</div>
</body>
</html>
