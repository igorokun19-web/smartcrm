<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    width:1080px;height:1920px;
    background:#080808;
    font-family:'Arial Black',Arial,sans-serif;
    overflow:hidden;color:white;
  }

  .glow-red{
    position:absolute;width:800px;height:800px;border-radius:50%;
    background:radial-gradient(circle,rgba(220,30,30,.18) 0%,transparent 65%);
    top:-200px;right:-200px;animation:g1 9s ease-in-out infinite;
  }
  @keyframes g1{0%,100%{transform:translate(0,0);}50%{transform:translate(-60px,100px);}}

  /* HOOK */
  .hook{
    position:absolute;top:4%;width:100%;text-align:center;
    opacity:0;animation:hookIn .5s cubic-bezier(.175,.885,.32,1.275) .15s forwards;
  }
  @keyframes hookIn{from{transform:scale(3);opacity:0;filter:blur(15px);}to{transform:scale(1);opacity:1;filter:none;}}
  .hook-emoji{font-size:90px;display:block;margin-bottom:10px;}
  .hook h1{
    font-size:88px;font-weight:900;line-height:1.0;
    background:linear-gradient(135deg,#ff2222,#ff8800,#ffdd00);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    padding:0 20px;
    filter:drop-shadow(0 0 20px rgba(255,80,0,.3));
  }
  .hook-sub{
    font-size:38px;color:rgba(255,255,255,.8);margin-top:14px;
  }

  /* MONEY LEAK VISUAL */
  .money-container{
    position:absolute;top:28%;left:40px;right:40px;
    opacity:0;animation:slideUp .7s ease 1.1s forwards;
  }
  @keyframes slideUp{from{transform:translateY(80px);opacity:0;}to{opacity:1;transform:none;}}

  .month-row{
    display:flex;align-items:stretch;gap:12px;
    margin-bottom:14px;
  }
  .month-label{
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
    border-radius:16px;padding:20px 22px;
    font-size:26px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    min-width:130px;
  }
  .month-bar-wrap{
    flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
    border-radius:16px;padding:18px 20px;
    display:flex;align-items:center;gap:16px;
  }
  .bar-fill{
    height:28px;border-radius:100px;
    background:linear-gradient(90deg,#ff2222,#ff6600);
    box-shadow:0 0 16px rgba(255,60,0,.4);
    animation:barGrow 1s ease forwards;
    width:0;
  }
  @keyframes barGrow{to{width:var(--w);}}
  .bar-amount{
    font-size:28px;font-weight:900;color:#ff6644;
    min-width:100px;text-align:left;
  }

  .divider{
    height:2px;background:linear-gradient(90deg,transparent,rgba(255,100,0,.4),transparent);
    margin:18px 0;border-radius:2px;
  }

  .total-row{
    background:linear-gradient(135deg,rgba(255,30,30,.12),rgba(255,100,0,.08));
    border:1px solid rgba(255,50,50,.3);
    border-radius:20px;padding:28px 32px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .total-label{font-size:32px;font-weight:700;color:rgba(255,255,255,.8);}
  .total-num{
    font-size:72px;font-weight:900;
    background:linear-gradient(135deg,#ff2222,#ff8800);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }

  /* CAUSE */
  .cause{
    position:absolute;bottom:17%;left:40px;right:40px;
    opacity:0;animation:slideUp .6s ease 2.5s forwards;
  }
  .cause-title{
    font-size:36px;color:rgba(255,255,255,.6);
    text-align:center;margin-bottom:16px;
  }
  .cause-item{
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
    border-radius:16px;padding:18px 24px;
    display:flex;align-items:center;gap:16px;
    font-size:24px;margin-bottom:10px;
  }
  .cause-num{
    background:rgba(255,50,50,.2);color:#ff6655;
    border-radius:100px;padding:4px 16px;
    font-weight:700;font-size:22px;min-width:44px;text-align:center;
  }

  .cta{
    position:absolute;bottom:5%;width:100%;text-align:center;
    opacity:0;animation:fadeIn .5s ease 3.3s forwards;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .cta p{font-size:36px;color:rgba(255,255,255,.75);}
  .cta .handle{font-size:30px;color:#ff8800;font-weight:700;margin-top:8px;}
</style>
</head>
<body>
  <div class="glow-red"></div>

  <!-- HOOK -->
  <div class="hook">
    <span class="hook-emoji">💸</span>
    <h1>כמה כסף<br>אתה מאבד<br>בחודש?</h1>
    <div class="hook-sub">מחשבון אמיתי לבעלי מקצוע</div>
  </div>

  <!-- MONEY LEAK -->
  <div class="money-container">
    <div class="month-row">
      <div class="month-label">לידים<br>לא נענו</div>
      <div class="month-bar-wrap">
        <div class="bar-fill" style="--w:55%"></div>
        <div class="bar-amount">₪1,800</div>
      </div>
    </div>
    <div class="month-row">
      <div class="month-label">לקוחות<br>ישנים</div>
      <div class="month-bar-wrap">
        <div class="bar-fill" style="--w:38%;animation-delay:.3s"></div>
        <div class="bar-amount">₪1,200</div>
      </div>
    </div>
    <div class="month-row">
      <div class="month-label">פולו-אפ<br>חסר</div>
      <div class="month-bar-wrap">
        <div class="bar-fill" style="--w:30%;animation-delay:.6s"></div>
        <div class="bar-amount">₪900</div>
      </div>
    </div>
    <div class="month-row">
      <div class="month-label">הצעות<br>תקועות</div>
      <div class="month-bar-wrap">
        <div class="bar-fill" style="--w:22%;animation-delay:.9s"></div>
        <div class="bar-amount">₪700</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="total-row">
      <div class="total-label">סה"כ לחודש</div>
      <div class="total-num">₪4,600</div>
    </div>
  </div>

  <!-- CAUSE -->
  <div class="cause">
    <div class="cause-title">הסיבה? ניהול ידני</div>
    <div class="cause-item">
      <div class="cause-num">1</div>
      <span>אין מעקב — לידים נשכחים</span>
    </div>
    <div class="cause-item">
      <div class="cause-num">2</div>
      <span>אין תזכורות — פולו-אפ לא יוצא</span>
    </div>
    <div class="cause-item">
      <div class="cause-num">3</div>
      <span>אין CRM — אנרגיה על ניירת</span>
    </div>
  </div>

  <!-- CTA -->
  <div class="cta">
    <p>פתרון בחינם בביו ⬇️</p>
    <div class="handle">@okun_igal</div>
  </div>
</body>
</html>
