name: Keep Services Alive

on:
  schedule:
    # Runs every 10 minutes — keeps Render free tier from spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SmartCRM backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://smartcrm-3cle.onrender.com/api/health)
          echo "SmartCRM health: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Ping CareerPilot frontend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://careerpilot-ai-beige-beta.vercel.app)
          echo "CareerPilot status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
