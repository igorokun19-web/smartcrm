name: Keep Services Alive

on:
  schedule:
    # Runs every 14 minutes — keeps Render free tier from spinning down
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SmartCRM backend
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 https://smartcrm-3cle.onrender.com/api/health)
            echo "Attempt $i — SmartCRM health: $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 15
          done
          echo "⚠️ Backend did not respond after 3 attempts (may be warming up)"
          exit 0
