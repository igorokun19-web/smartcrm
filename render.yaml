services:
  - type: web
    name: smartcrm-backend
    runtime: node
    region: ohio
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://frontend-two-pearl-10.vercel.app
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OWNER_USERNAMES
        sync: false
      - key: SUPABASE_URL
        value: https://scbukcbotjjovbmgdwhw.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
